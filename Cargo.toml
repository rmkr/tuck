[package]
name = "tuck"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
# Enables deterministic process termination tests. Omitted from release builds.
test-hooks = []

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rmcp = { version = "=3.8.0", features = ["transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tokio-util = "0.7"
turso = { version = "=0.8.3", default-features = false }
uuid = { version = "1", features = ["v4"] }
